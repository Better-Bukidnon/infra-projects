name: Bisto.ph sync

# Refreshes data/projects.json from the BetterGov DPWH API once a day and
# commits it if anything changed. Data goes straight to `main` (production,
# which Cloudflare deploys) and is then merged into `develop`, so production
# stays fresh and develop never falls behind. Schedules run from the default
# branch (develop), which is why the branches are named explicitly here.

on:
  schedule:
    - cron: '0 20 * * *' # 04:00 PHT
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bisto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync.mjs
      - name: Commit if changed
        run: |
          # lastSyncedAt always changes; only commit when project data does.
          if git diff --quiet -I '"lastSyncedAt"' -- data/projects.json; then
            echo "No project changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "Sync Bisto.ph projects"
          git push origin HEAD:main
          # Keep develop up to date. Only the sync touches data/projects.json,
          # so this merge does not conflict.
          git switch develop
          git merge --no-edit main
          git push origin develop
